<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Speedrun Overlay</title>

<style>
:root{
  --main:#ff0058;
  --pb:#ffff00; /* PB upozornění žlutě */
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:transparent;
  font-family:"SF Mono",system-ui,monospace;
  color:white;
  overflow:hidden;
  touch-action:manipulation;
}

#wrap{
  width:100%;
  max-width:720px;
  padding:16px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  font-variant-numeric: tabular-nums;
}

/* Date & clock */
#date{
  font-size:18px;
  opacity:.75;
}

#clock{
  font-size:22px;
  font-weight:700;
  opacity:.9;
  margin-bottom:10px;
}

/* Stopwatch */
#time{
  display:flex;
  align-items:flex-start;
  font-size:clamp(64px, 12vw, 110px);
  font-weight:900;
  color:var(--main);
  text-shadow:0 0 25px var(--main);
  letter-spacing:2px;
}

#time-main{
  white-space:nowrap;
}

#ms{
  font-size:clamp(28px, 5vw, 48px);
  margin-left:8px;
  line-height:1;
  opacity:.8;
}

/* PB display */
#pbTime{
  margin-top:6px;
  font-size:16px;
  opacity:.85;
  user-select:none;
  color:var(--main);
  text-shadow:0 0 20px var(--main);
}

/* Controls */
#controls{
  display:flex;
  gap:12px;
  margin-top:14px;
}

button{
  min-width:120px;
  padding:14px 20px;
  font-size:18px;
  font-weight:800;
  border-radius:14px;
  border:none;
}

#startBtn{
  background:var(--main);
  color:black;
  box-shadow:0 0 18px var(--main);
}

/* Flash */
#flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s;
}
</style>
</head>
<body>

<div id="wrap">
  <div id="flash"></div>

  <div id="date"></div>
  <div id="clock"></div>

  <div id="time">
    <div id="time-main">00:00:00</div>
    <div id="ms">000</div>
  </div>

  <div id="pbTime">PB: --:--:--.---</div>

  <div id="controls">
    <button id="startBtn">Start</button>
  </div>
</div>

<script>
/* ===== DATE & CLOCK ===== */
const dateEl=document.getElementById("date");
const clockEl=document.getElementById("clock");
function updateDateTime(){
  const d=new Date();
  dateEl.textContent=
    String(d.getDate()).padStart(2,"0")+"."+
    String(d.getMonth()+1).padStart(2,"0")+"."+
    d.getFullYear();
  clockEl.textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+":"+
    String(d.getSeconds()).padStart(2,"0");
}
updateDateTime();
setInterval(updateDateTime,1000);

/* ===== STATE ===== */
const State={IDLE:0,RUNNING:1,PAUSED:2};
let state=State.IDLE;
let startTime=0;
let elapsed=0;
let raf=null;

/* ===== PB ===== */
const PB_KEY="speedrun_pb";
let best=Number(localStorage.getItem(PB_KEY))||null;

/* ===== UI ===== */
const wrap=document.getElementById("wrap");
const timeMain=document.getElementById("time-main");
const msEl=document.getElementById("ms");
const pbEl=document.getElementById("pbTime");
const flash=document.getElementById("flash");
const startBtn=document.getElementById("startBtn");

/* ===== FORMAT ===== */
function fmt(t){
  const h=Math.floor(t/3600000);
  const m=Math.floor(t/60000)%60;
  const s=Math.floor(t/1000)%60;
  const ms=Math.floor(t%1000);
  return {
    main:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`,
    ms:String(ms).padStart(3,"0")
  };
}

function updatePBText(colorMain=false){
  if(best===null){
    pbEl.textContent="PB: --:--:--.---";
    pbEl.style.color=varMain;
    pbEl.style.textShadow=`0 0 20px var(--main)`;
  }else{
    const f=fmt(best);
    pbEl.textContent=`PB: ${f.main}.${f.ms}`;
    if(colorMain){
      pbEl.style.color="yellow";
      pbEl.style.textShadow="0 0 25px yellow";
    }else{
      pbEl.style.color="var(--main)";
      pbEl.style.textShadow="0 0 20px var(--main)";
    }
  }
}
updatePBText();

/* ===== RENDER ===== */
function render(t){
  const f=fmt(t);
  timeMain.textContent=f.main;
  msEl.textContent=f.ms;
}

/* ===== LOOP ===== */
function loop(now){
  if(state!==State.RUNNING) return;
  render(elapsed+(now-startTime));
  raf=requestAnimationFrame(loop);
}

/* ===== ACTIONS ===== */
function flashPB(){
  flash.style.opacity="1";
  setTimeout(()=>flash.style.opacity="0",120);
}

function finishRun(){
  const total=elapsed;
  if(best===null || total<best){
    best=total;
    localStorage.setItem(PB_KEY,best);
    updatePBText(true); // PB upozornění žlutě
    flashPB();
  }
}

function startRun(){
  state=State.RUNNING;
  startTime=performance.now();
  startBtn.textContent="Pause";
  raf=requestAnimationFrame(loop);
}

function pauseRun(){
  elapsed+=performance.now()-startTime;
  state=State.PAUSED;
  startBtn.textContent="Start";
  finishRun(); // PB upozornění
}

/* ===== CONTROLS ===== */
startBtn.onclick=()=>{
  if(state===State.RUNNING) pauseRun();
  else startRun();
};

/* Keyboard */
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){ e.preventDefault(); startBtn.click(); }
});

/* Auto pause */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden && state===State.RUNNING){
    pauseRun();
  }
});

/* ===== HIDDEN PB RESET (LONG PRESS) ===== */
let holdTimer=null;
pbEl.addEventListener("pointerdown",()=>{
  holdTimer=setTimeout(()=>{
    localStorage.removeItem(PB_KEY);
    best=null;
    updatePBText(false);
  },2000);
});
pbEl.addEventListener("pointerup",()=>clearTimeout(holdTimer));
pbEl.addEventListener("pointerleave",()=>clearTimeout(holdTimer));

/* Init */
render(0);
</script>

</body>
</html>
