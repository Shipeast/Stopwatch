<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Speedrun Overlay</title>

<style>
:root{
  --main:#ff0058;
  --pb:#39ff14;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:transparent;
  font-family:"SF Mono",system-ui,monospace;
  color:white;
  overflow:hidden;
  touch-action:manipulation;
}

#wrap{
  width:100%;
  max-width:720px;
  padding:16px 20px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Date & clock */
#date{
  font-size:18px;
  opacity:.75;
}

#clock{
  font-size:22px;
  font-weight:700;
  opacity:.9;
  margin-bottom:10px;
}

/* Stopwatch */
#time{
  font-size:clamp(64px, 12vw, 110px);
  font-weight:900;
  color:var(--main);
  text-shadow:0 0 25px var(--main);
  letter-spacing:2px;
}

#ms{
  font-size:clamp(28px, 5vw, 48px);
  margin-left:8px;
  vertical-align:super;
  opacity:.8;
}

/* Controls */
#controls{
  display:flex;
  gap:12px;
  margin-top:16px;
}

button{
  min-width:120px;
  padding:14px 20px;
  font-size:18px;
  font-weight:800;
  border-radius:14px;
  border:none;
}

#startBtn{
  background:var(--main);
  color:black;
  box-shadow:0 0 18px var(--main);
}

#resetBtn{
  background:rgba(255,255,255,0.08);
  color:#ccc;
  border:1px solid rgba(255,255,255,0.15);
}

/* PB */
#pbBadge{
  position:absolute;
  bottom:6px;
  right:10px;
  font-size:18px;
  font-weight:800;
  color:var(--pb);
  opacity:0;
  text-shadow:0 0 12px var(--pb);
  transition:opacity .3s;
}

#wrap.pb #time{
  color:var(--pb);
  text-shadow:0 0 40px var(--pb);
}

#wrap.pb #pbBadge{
  opacity:1;
}

/* Flash */
#flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s;
}
</style>
</head>
<body>

<div id="wrap">
  <div id="flash"></div>

  <div id="date"></div>
  <div id="clock"></div>

  <div id="time">00:00:00<span id="ms">000</span></div>

  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="pbBadge">PB</div>
</div>

<script>
/* ===== DATE & CLOCK ===== */
const dateEl=document.getElementById("date");
const clockEl=document.getElementById("clock");

function updateDateTime(){
  const d=new Date();
  dateEl.textContent=
    String(d.getDate()).padStart(2,"0")+"."+
    String(d.getMonth()+1).padStart(2,"0")+"."+
    d.getFullYear();
  clockEl.textContent=
    String(d.getHours()).padStart(2,"0")+":"+
    String(d.getMinutes()).padStart(2,"0")+":"+
    String(d.getSeconds()).padStart(2,"0");
}
updateDateTime();
setInterval(updateDateTime,1000);

/* ===== STATE ===== */
const State={IDLE:0,RUNNING:1,PAUSED:2};
let state=State.IDLE;

let startTime=0;
let elapsed=0;
let raf=null;

/* ===== PB ===== */
const PB_KEY="speedrun_pb";
let best=Number(localStorage.getItem(PB_KEY))||null;

/* ===== UI ===== */
const wrap=document.getElementById("wrap");
const timeEl=document.getElementById("time");
const msEl=document.getElementById("ms");
const flash=document.getElementById("flash");
const startBtn=document.getElementById("startBtn");
const resetBtn=document.getElementById("resetBtn");

/* ===== FORMAT ===== */
function format(t){
  const h=Math.floor(t/3600000);
  const m=Math.floor(t/60000)%60;
  const s=Math.floor(t/1000)%60;
  const ms=Math.floor(t%1000);
  return {
    main:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`,
    ms:String(ms).padStart(3,"0")
  };
}

/* ===== RENDER ===== */
function render(t){
  const f=format(t);
  timeEl.firstChild.nodeValue=f.main;
  msEl.textContent=f.ms;
}

/* ===== LOOP ===== */
function loop(now){
  if(state!==State.RUNNING) return;
  render(elapsed+(now-startTime));
  raf=requestAnimationFrame(loop);
}

/* ===== ACTIONS ===== */
function flashPB(){
  flash.style.opacity="1";
  setTimeout(()=>flash.style.opacity="0",120);
}

function finishRun(){
  const total=elapsed;
  if(best===null || total<best){
    best=total;
    localStorage.setItem(PB_KEY,best);
    wrap.classList.add("pb");
    flashPB();
  }
}

function startRun(){
  wrap.classList.remove("pb");
  state=State.RUNNING;
  startTime=performance.now();
  startBtn.textContent="Pause";
  raf=requestAnimationFrame(loop);
}

function pauseRun(){
  elapsed+=performance.now()-startTime;
  state=State.PAUSED;
  startBtn.textContent="Start";
  finishRun();
}

function resetAll(){
  cancelAnimationFrame(raf);
  raf=null;
  state=State.IDLE;
  elapsed=0;
  startTime=0;
  startBtn.textContent="Start";
  wrap.classList.remove("pb");
  render(0);
}

/* ===== BUTTONS ===== */
startBtn.onclick=()=>{
  if(state===State.RUNNING) pauseRun();
  else startRun();
};
resetBtn.onclick=resetAll;

/* ===== KEYBOARD ===== */
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    startBtn.click();
  }
  if(e.code==="KeyR"){
    resetAll();
  }
});

/* Auto pause */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden && state===State.RUNNING){
    pauseRun();
  }
});

/* Init */
render(0);
</script>

</body>
</html>
